name: Update NOAA data

# Runs on GitHub-hosted runners, which have unrestricted egress to NOAA / NWS /
# NCEI / CPC / Census hosts.  The pipeline commits its output back to the repo
# and GitHub Pages serves it.  A human-readable copy of the run log is always
# committed to data/pipeline.log so a run can be reviewed without downloading
# Actions logs.

on:
  # Triggered by ANY push to any branch, not just pipeline changes: the data in
  # data/ is committed by this job, so a push that touches the site must also
  # refresh the datasets rather than leaving stale ones behind.
  push:
    branches: ['**']
  schedule:
    # 07:15 UTC = 00:15 America/Los_Angeles, just after the NWS 00Z cycle and
    # after CPC posts its daily 6-10 / 8-14 day outlooks (15:00-16:00 ET).
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Scoped per ref.  A single global group meant a push on one branch could
  # cancel the data refresh of another branch -- observed on 18 Sep 2026, when
  # this branch's push run was cancelled by a "higher priority waiting request"
  # from elsewhere and the branch kept the previous dataset.  Within one ref the
  # newest push still supersedes the one before it, which is what we want.
  group: update-noaa-data-${{ github.ref }}
  cancel-in-progress: true

# Runner pinned to ubuntu-24.04 and actions bumped to their node24 majors for
# the same reason documented in site-test.yml: the ubuntu-latest label migrates
# to Ubuntu 26.04 between 19 October and 19 November 2026 and this workflow
# runs unattended nightly through that window.  setup-python@v6 still accepts
# the python-version input used here; upload-artifact@v6 still accepts
# name/path/retention-days.
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Environment diagnostics
        run: |
          mkdir -p data assets/cpc
          {
            echo "runner: $(uname -a)"
            echo "python: $(python3 --version)"
            echo "date:   $(date -u)"
            echo "sha:    ${{ github.sha }}"
            echo "ref:    ${{ github.ref }}"
          } > data/run_diagnostics.txt
          cat data/run_diagnostics.txt

      - name: Run the NOAA fetch pipeline
        run: |
          set +e
          python3 -u pipeline/main.py --outdir data > pipeline_run.log 2>&1
          code=$?
          cat pipeline_run.log
          echo "PIPELINE_EXIT=$code" >> data/run_diagnostics.txt
          exit $code

      - name: Build the Oct 2026 - Jan 2027 scoreboard dataset
        run: |
          set +e
          python3 -u pipeline/build_calendar.py 2>&1 | tee -a pipeline_run.log
          code=${PIPESTATUS[0]}
          echo "CALENDAR_EXIT=$code" >> data/run_diagnostics.txt
          exit $code

      - name: Back-test CPC seasonal outlooks against observed history
        run: |
          set +e
          python3 -u pipeline/cpc_backtest.py 2>&1 | tee -a pipeline_run.log
          code=${PIPESTATUS[0]}
          echo "CPC_BACKTEST_EXIT=$code" >> data/run_diagnostics.txt
          exit $code

      - name: Build landlord-focused summary
        run: |
          set +e
          python3 -u pipeline/landlord_summary.py 2>&1 | tee -a pipeline_run.log
          code=${PIPESTATUS[0]}
          echo "LANDLORD_EXIT=$code" >> data/run_diagnostics.txt
          exit $code

      - name: Build the printable executive summary (machine-generated, drift-proof)
        run: |
          set +e
          python3 -u pipeline/executive_summary.py 2>&1 | tee -a pipeline_run.log
          code=${PIPESTATUS[0]}
          echo "EXEC_SUMMARY_EXIT=$code" >> data/run_diagnostics.txt
          exit $code

      - name: Build the storm-watch digest (JSON + RSS)
        run: |
          set +e
          python3 -u pipeline/build_digest.py 2>&1 | tee -a pipeline_run.log
          code=${PIPESTATUS[0]}
          echo "DIGEST_EXIT=$code" >> data/run_diagnostics.txt
          exit $code

      - name: Retrieve NMME model guidance (separate tier, never a forecast)
        run: |
          set +e
          python3 -u pipeline/model_guidance.py 2>&1 | tee -a pipeline_run.log
          code=${PIPESTATUS[0]}
          echo "MODEL_GUIDANCE_EXIT=$code" >> data/run_diagnostics.txt
          exit $code

      - name: Build the official-product feed (derived, no network access)
        run: |
          set +e
          python3 -u pipeline/build_feed.py 2>&1 | tee -a pipeline_run.log
          code=${PIPESTATUS[0]}
          echo "FEED_EXIT=$code" >> data/run_diagnostics.txt
          exit $code

      - name: Verify that every source URL is an official domain
        run: |
          set +e
          python3 -u pipeline/verify_sources.py 2>&1 | tee -a pipeline_run.log
          code=${PIPESTATUS[0]}
          echo "VERIFY_EXIT=$code" >> data/run_diagnostics.txt
          exit $code

      - name: Verify every published number against its source (claim ledger)
        run: |
          set +e
          python3 -u pipeline/verify_claims.py 2>&1 | tee -a pipeline_run.log
          code=${PIPESTATUS[0]}
          echo "CLAIMS_EXIT=$code" >> data/run_diagnostics.txt
          exit $code

      - name: Fail loudly if the pipeline lost a critical source
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("data/quality_report.json")
          if not p.exists():
              print("CRITICAL: quality_report.json was not produced")
              sys.exit(1)
          q = json.loads(p.read_text())
          errs = [i for i in q["irregularities"] if i["severity"] == "error"]
          print(f"warnings={q['counts']['warnings']} info={q['counts']['info']} errors={len(errs)}")
          for e in errs:
              print(" -", e["area"], ":", e["message"])
          sys.exit(1 if errs else 0)
          PY

      - name: Upload the run log for inspection
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-run-log
          path: pipeline_run.log
          retention-days: 7

      - name: Commit refreshed data and diagnostics
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -x
          mkdir -p data assets/cpc
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The claim ledger is only meaningful if a failure actually stops the
          # data being published.  If any check failed, commit the diagnostics
          # (so the failure is visible and reviewable) but DO NOT commit the
          # datasets: the site then keeps the last verified numbers instead of
          # publishing ones that could not be re-derived from their source.
          # The exit-code gate below closes the complementary hole: if a
          # mid-pipeline step crashes, the steps after it are skipped and
          # data/verify.json is the stale file from the last run (usually a
          # pass) — publishing on that verdict alone would ship unverified
          # data.  Every step must have run green in THIS run.
          VERDICT=$(python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/verify.json")
          if not p.exists():
              print("missing")
              raise SystemExit
          d = json.loads(p.read_text())
          s = d.get("summary", {})
          print("fail" if s.get("failed") else "pass")
          PY
          )
          STEPS_OK=$(python3 - <<'PY'
          import pathlib
          p = pathlib.Path("data/run_diagnostics.txt")
          lines = set(p.read_text().splitlines()) if p.exists() else set()
          need = ["PIPELINE_EXIT=0", "CALENDAR_EXIT=0", "CPC_BACKTEST_EXIT=0",
                  "LANDLORD_EXIT=0", "EXEC_SUMMARY_EXIT=0", "DIGEST_EXIT=0",
                  "MODEL_GUIDANCE_EXIT=0",
                  "FEED_EXIT=0", "VERIFY_EXIT=0", "CLAIMS_EXIT=0"]
          missing = [n for n in need if n not in lines]
          print("yes" if not missing else "no:" + ",".join(missing))
          PY
          )
          echo "CLAIM_LEDGER_VERDICT=$VERDICT"
          echo "PIPELINE_STEPS_OK=$STEPS_OK"

          if [ "$VERDICT" = "pass" ] && [ "$STEPS_OK" = "yes" ]; then
            git add -A data assets/cpc assets/model_guidance
            MSG="data: refresh NOAA/NWS/NCEI/CPC sources [skip ci]"
          else
            git add -f data/pipeline.log data/run_diagnostics.txt data/quality_report.json \
                      data/verify.json data/verify_report.txt data/summary.txt 2>/dev/null || true
            MSG="chore(data): refresh NOT published - verification ledger did not pass [skip ci]"
            echo "gate blocked publish: VERDICT=$VERDICT STEPS_OK=$STEPS_OK"
          fi
          git add -A pipeline_run.log || echo "no run log to add"
          git status --short | head -40
          if git diff --cached --quiet; then
            echo "NOTHING_TO_COMMIT"
          else
            git commit -m "$MSG

          Automated refresh by .github/workflows/update-data.yml (run ${{ github.run_id }})
          Claim ledger verdict: $VERDICT"
            git push origin "HEAD:$BRANCH" || echo "PUSH_FAILED"
          fi
          set +x
