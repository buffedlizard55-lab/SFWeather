name: Tests

# The site is plain HTML/CSS/JS with no build step, so a broken page would not be
# caught by the data pipeline.  This job renders the page headlessly against the
# committed datasets and fails if any section is empty, the day dialog breaks, or
# the CSV export throws.

on:
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - 'pipeline/**'
      - 'package.json'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/site-test.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - 'pipeline/**'
      - 'package.json'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# Runners are pinned to ubuntu-24.04 on purpose.  GitHub announced that the
# ubuntu-latest label migrates from Ubuntu 24.04 to Ubuntu 26.04 gradually
# between 19 October and 19 November 2026
# (https://github.blog/changelog/2026-09-17-ubuntu-26-generally-available-and-latest-migration).
# This project's nightly data refresh runs unattended through that window, so
# the image must not change underneath it mid-season; the move to 26.04 is a
# deliberate, verified migration for a later session.  The action majors below
# are the lowest that declare `using: node24` in their own action.yml
# (checkout@v5, setup-node@v5, setup-python@v6, upload-artifact@v6), read from
# the tag rather than release notes: the Node 20 runtime is deprecated on
# GitHub-hosted runners and the runners already force Node 24 with a warning.
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install test-only dependencies from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Render the site headlessly and check it
        run: npm test
      - name: Falsify the render guards (a guard that cannot fail is decoration)
        run: python3 tests/falsify_smoke.py
      - name: Verify committed source provenance
        run: python3 pipeline/verify_sources.py
  parsers:
    # Offline: standard library only, no network, no third-party packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Parse and derive unit tests
        run: python3 tests/test_parsers.py
      - name: Falsify the claim-ledger guards
        run: python3 tests/falsify_guards.py
      # Each auxiliary tier ships its own offline self-test.  They exist because
      # these modules fetch pages this project cannot reach from a sandbox, so
      # the only way to prove the parsing, the quote handling and the failure
      # paths is to run them against synthetic NOAA-shaped fixtures.
      # (The CPC back-test is covered by tests/test_parsers.py, which imports the
      # module directly; it ships no separate --selftest flag.)
      - name: Model-guidance tier self-test (offline)
        run: python3 pipeline/model_guidance.py --selftest
      - name: Official-product feed self-test (offline)
        run: python3 pipeline/build_feed.py --selftest
