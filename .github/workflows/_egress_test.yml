name: egress-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test NWS API egress
        run: |
          echo "=== api.weather.gov points ==="
          curl -sS -m 30 -H "User-Agent: SFWeather-EgressTest (contact: repo owner)" \
            "https://api.weather.gov/points/37.7599,-122.4849" | head -c 400
          echo
          echo "=== cpc long-lead ==="
          curl -sS -o /dev/null -w "cpc_status=%{http_code}\n" -m 30 -H "User-Agent: Mozilla/5.0" \
            "https://www.cpc.ncep.noaa.gov/"
          echo "=== ncei gsod ==="
          curl -sS -o /dev/null -w "ncei_status=%{http_code}\n" -m 30 -H "User-Agent: Mozilla/5.0" \
            "https://www.ncei.noaa.gov/data/global-summary-of-the-day/access/2020/72494023234.csv"
          echo "=== ncei ghcn daily ==="
          curl -sS -o /dev/null -w "ghcn_status=%{http_code}\n" -m 30 -H "User-Agent: Mozilla/5.0" \
            "https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/USW00023272.csv"
          echo "=== ncei climate at a glance ==="
          curl -sS -o /dev/null -w "cag_status=%{http_code}\n" -m 30 -H "User-Agent: Mozilla/5.0" \
            "https://www.ncei.noaa.gov/access/monitoring/climate-at-a-glance/"
          echo "=== drought monitor ==="
          curl -sS -o /dev/null -w "dm_status=%{http_code}\n" -m 30 -H "User-Agent: Mozilla/5.0" \
            "https://droughtmonitor.unl.edu/"
          echo "=== storm events ==="
          curl -sS -o /dev/null -w "sde_status=%{http_code}\n" -m 30 -H "User-Agent: Mozilla/5.0" \
            "https://www.ncdc.noaa.gov/stormevents/"
